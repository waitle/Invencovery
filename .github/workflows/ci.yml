name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
    inputs:
      live:
        description: 'Also run the live API smoke tests (RECYCLEWHEEL_LIVE=1, unauthenticated, at most 8 requests)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        # engines.node is >=22.13 (node:sqlite without a flag); test the floor and the current line.
        node: ['22.13.x', '24.x']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Plugin manifests are valid JSON
        run: >-
          node -e "for (const f of ['.claude-plugin/plugin.json', '.claude-plugin/marketplace.json']) JSON.parse(require('node:fs').readFileSync(f, 'utf8'))"

      - name: Lint skill
        run: npm run lint:skill

      - name: Smoke (stdio MCP)
        run: npm run test:smoke

  # Opt-in only: run it from the Actions tab with "live" checked. Never part of push/PR runs.
  live:
    name: live API smoke (manual)
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.live }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.x
          cache: npm

      - name: Install
        run: npm ci

      # Unauthenticated on purpose (no GITHUB_TOKEN): a shared runner IP may hit rate limits,
      # which the live tests report as a warning, not a failure.
      - name: Live tests
        env:
          RECYCLEWHEEL_LIVE: '1'
          RECYCLEWHEEL_NO_GH_CLI: '1'
        run: npm run test:live
